<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم وسحب العجلة - متجر النور</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .store-badge {
            background: #38bdf8;
            color: #0f172a;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 10px;
        }
        input, button {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            width: 90%;
            outline: none;
        }
        input[type="text"], input[type="datetime-local"] { background: #334155; color: #fff; text-align: center; border: 1px solid #475569; }
        input[type="file"] { background: #1e293b; color: #94a3b8; border: 1px dashed #38bdf8; cursor: pointer; padding: 10px; }
        
        button {
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }
        .btn-spin {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-spin:hover { background: linear-gradient(135deg, #059669, #047857); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-danger:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }

        .gift-control-box {
            background: rgba(56, 189, 248, 0.05);
            border: 1px dashed #38bdf8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: right;
        }
        .gift-control-box label {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        #wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            border: 4px solid #38bdf8;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        #winner-display {
            font-size: 22px;
            color: #34d399;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }
        .participants-list {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            text-align: right;
            font-size: 14px;
            border: 1px solid #334155;
        }
    </style>

    <!-- مكتبة فايربيس السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="store-badge">⚙️ لوحة تحكم وسحب متجر النور ⚙️</div>
    <h2>إدارة عجلة الحظ السحابية</h2>

    <!-- قسم تحديد موعد السحب -->
    <div class="gift-control-box">
        <label>⏰ تحديد موعد السحب (يظهر للزوار):</label>
        <input type="datetime-local" id="schedule-time-input">
        <button class="btn-primary" style="margin-top: 8px;" onclick="saveScheduleTime()">حفظ وتحديث موعد السحب للزوار</button>
    </div>

    <!-- قسم إدخال اسم الهدية وصورتها كملف محلي -->
    <div class="gift-control-box">
        <label>🎁 تحديد هدية المسابقة الحالية:</label>
        <input type="text" id="gift-name-input" placeholder="اكتب اسم الهدية (مثال: هاتف محمول)...">
        <label style="margin-top: 10px;">📷 إرفاق صورة الهدية (ملف من جهازك):</label>
        <input type="file" id="gift-image-file" accept="image/*">
        <button class="btn-primary" onclick="saveGiftInfo()">حفظ الهدية وعرضها للزوار</button>
    </div>

    <div id="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="280" height="280"></canvas>
    </div>

    <button class="btn-spin" onclick="spinWheel()">🎲 ابدأ السحب واختيار الفائز</button>
    <button class="btn-danger" onclick="resetAllData()">🗑️ تصفير المسابقة ومسح الكل</button>

    <div id="winner-display"></div>

    <div class="participants-list">
        <strong>المشاركون الحاليون (<span id="count">0</span>/30):</strong>
        <div id="names-box">جاري التحميل...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDfEFZMasZU-lPBveTL36rEPIyCBH1jMvw",
        authDomain: "alnoor-store-5555.firebaseapp.com",
        databaseURL: "https://alnoor-store-5555-default-rtdb.firebaseio.com",
        projectId: "alnoor-store-5555",
        storageBucket: "alnoor-store-5555.firebasestorage.app",
        messagingSenderId: "951084767888",
        appId: "1:951084767888:web:1ff4029e912885d7d95615",
        measurementId: "G-MQH03HZERC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let participants = [];
    let currentGiftName = "الجائزة الكبرى";
    let isSpinning = false;
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    function drawWheel(rotationAngle = 0) {
        let numOptions = participants.length;
        ctx.clearRect(0, 0, 280, 280);
        
        if(numOptions === 0) {
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.arc(140, 140, 132, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = "#94a3b8";
            ctx.font = "13px Tahoma";
            ctx.fillText("لا يوجد مشاركون حالياً", 80, 145);
            return;
        }

        let arcSize = (2 * Math.PI) / numOptions;
        let colors = ['#f43f5e', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#06b6d4', '#6366f1'];

        ctx.save();
        ctx.translate(140, 140);
        ctx.rotate(rotationAngle);
        ctx.translate(-140, -140);

        for(let i = 0; i < numOptions; i++) {
            let angle = i * arcSize;
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(140, 140);
            ctx.arc(140, 140, 132, angle, angle + arcSize);
            ctx.lineTo(140, 140);
            ctx.fill();

            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(140, 140);
            ctx.rotate(angle + arcSize / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px Tahoma";
            ctx.fillText(participants[i].name, 45, 5);
            ctx.restore();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.fillStyle = "#0f172a";
        ctx.arc(140, 140, 20, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // جلب البيانات من السيرفر
    db.ref('participants').on('value', (snapshot) => {
        let data = snapshot.val();
        participants = data ? Object.values(data) : [];
        document.getElementById('count').innerText = participants.length;
        
        let namesBox = document.getElementById('names-box');
        if(participants.length > 0) {
            namesBox.innerHTML = participants.map(p => `• ${p.name} (${p.phone})`).join('<br>');
        } else {
            namesBox.innerText = "القائمة فارغة حالياً.";
        }
        if(!isSpinning) drawWheel();
    });

    db.ref('giftInfo').on('value', (snapshot) => {
        let gift = snapshot.val();
        if(gift && gift.name) {
            currentGiftName = gift.name;
            document.getElementById('gift-name-input').value = gift.name;
        } else {
            document.getElementById('gift-name-input').value = "";
        }
    });

    db.ref('scheduleTime').on('value', (snapshot) => {
        let timeVal = snapshot.val();
        if(timeVal) {
            document.getElementById('schedule-time-input').value = timeVal;
        }
    });

    // دالة حفظ موعد السحب
    function saveScheduleTime() {
        let timeVal = document.getElementById('schedule-time-input').value;
        if(!timeVal) {
            alert("يرجى اختيار الموعد أولاً!");
            return;
        }
        db.ref('scheduleTime').set(timeVal, (error) => {
            if(!error) {
                alert("✅ تم حفظ وتحديث موعد السحب للزوار بنجاح!");
            } else {
                alert("حدث خطأ أثناء حفظ الموعد.");
            }
        });
    }

    // دالة لحفظ اسم وصورة الهدية المرفوعة كملف محلي إلى قاعدة البيانات
    function saveGiftInfo() {
        let nameInput = document.getElementById('gift-name-input').value.trim();
        let fileInput = document.getElementById('gift-image-file').files[0];

        if (!nameInput) {
            alert("يرجى كتابة اسم الهدية أولاً!");
            return;
        }

        if (fileInput) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64Image = e.target.result;
                db.ref('giftInfo').set({
                    name: nameInput,
                    image: base64Image
                }, (error) => {
                    if(error) {
                        alert("حدث خطأ أثناء الحفظ.");
                    } else {
                        alert("✅ تم حفظ الهدية وصورتها بنجاح وظهرت للزوار!");
                    }
                });
            };
            reader.readAsDataURL(fileInput);
        } else {
            db.ref('giftInfo/name').set(nameInput, (error) => {
                if(!error) alert("✅ تم حفظ اسم الهدية بنجاح!");
            });
        }
    }

    // دوران السحب العشوائي
    function spinWheel() {
        if (isSpinning) return;
        if (participants.length === 0) {
            alert("عذراً، لا يوجد أي مشاركين في القائمة لإجراء السحب!");
            return;
        }

        isSpinning = true;
        document.getElementById('winner-display').innerText = "🎲 جاري تدوير العجلة لاختيار الفائز...";

        let randomWinnerIndex = Math.floor(Math.random() * participants.length);
        let winnerObj = participants[randomWinnerIndex];

        let numOptions = participants.length;
        let arcSize = 360 / numOptions;
        let targetAngle = 360 - (randomWinnerIndex * arcSize + arcSize / 2);
        let totalRotations = 360 * 5; 
        let finalAngle = totalRotations + targetAngle;

        let startTime = null;
        let duration = 4000; 

        function animateSpin(currentTime) {
            if (!startTime) startTime = currentTime;
            let elapsed = currentTime - startTime;
            let progress = Math.min(elapsed / duration, 1);
            
            let easeProgress = 1 - Math.pow(1 - progress, 3);
            let currentRotation = (finalAngle * easeProgress) * (Math.PI / 180);

            drawWheel(currentRotation);

            if (progress < 1) {
                requestAnimationFrame(animateSpin);
            } else {
                isSpinning = false;
                document.getElementById('winner-display').innerText = `🏆 الفائز هو: ${winnerObj.name} 🏆`;
                
                db.ref('lastWinner').set(winnerObj.name);

                let cleanPhone = winnerObj.phone.trim();
                if (cleanPhone.startsWith('0')) {
                    cleanPhone = '2' + cleanPhone; 
                }
                let msg = `🎉 مبروك يا ${winnerObj.name}! لقد فزت معنا بـ (${currentGiftName}) في مسابقة عجلة الحظ الكبرى من "متجر النور". برجاء التواصل معنا لاستلام جائزتك! 🎁`;
                let whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
                window.open(whatsappUrl, '_blank');

                setTimeout(() => {
                    db.ref('participants').remove();
                    db.ref('giftInfo').remove();
                    db.ref('scheduleTime').set("اكتمل السحب وانتهت المسابقة");
                    alert(`🎉 تم إعلان الفائز (${winnerObj.name})، فتح الواتساب الخاص به، ومسح المشاركين وبيانات الهدية تلقائياً استعداداً لمسابقة جديدة!`);
                }, 1000);
            }
        }

        requestAnimationFrame(animateSpin);
    }

    function resetAllData() {
        if(confirm("هل أنت متأكد من رغبتك في تصفير المسابقة ومسح جميع الأسماء والهدية وقائمة الفائزين؟")) {
            db.ref('participants').remove();
            db.ref('giftInfo').remove();
            db.ref('lastWinner').remove();
            db.ref('scheduleTime').set("");
            document.getElementById('winner-display').innerText = "";
            document.getElementById('gift-name-input').value = "";
            document.getElementById('schedule-time-input').value = "";
            alert("تم مسح وإعادة تعيين بيانات المسابقة بنجاح.");
        }
    }
</script>

</body>
</html>
